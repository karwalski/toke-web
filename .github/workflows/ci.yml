name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: the site's own toke sources must compile under the pinned compiler.
  #
  # Story 132.17a: main.tk sat at HEAD for months written in v0.3 `=`-equality,
  # which tkc 2.8.0 rejects, so the website could not be rebuilt from its own
  # source until a worker migrated it by hand. Nothing caught it, because the
  # only compile step in this workflow was a placeholder echo. `make check-toke`
  # is that gate and it fails the build.
  check-toke:
    name: tkc --check (website toke sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO(48.1.4): tkc is not yet published to a public registry, so CI has
      # to build it from source. Replace with a release download once one
      # exists:
      #   curl -fsSL "${{ secrets.TKC_DOWNLOAD_URL }}" -o tkc && chmod +x tkc
      #
      # 132.149: karwalski/toke and karwalski/ooke are public, so every sibling
      # checkout in this file is anonymous. Each one used to pass a `token:`
      # read from the TOKE_REPO_TOKEN secret, which this repository does not
      # have; an empty token fails actions/checkout outright ("Input required
      # and not supplied: token"). This step failed that way on every run from
      # 2026-09-22 on, so build-smoke (which needs this job) has never run
      # since it stopped being a placeholder. Do not add a token back for a
      # public repository.
      #
      # This is toke `main`, unpinned: the job builds whatever main is at the
      # time of the run (3.2.0 plus tracker commits on 2026-11-15). Pinning it
      # (a TOKE_REF beside OOKE_REF) is an open owner decision under 132.149.
      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          repository: karwalski/toke
          path: .toke

      # zlib1g-dev: tkc itself links -lz (toke Makefile LDLIBS); toke's own
      # workflow installs it for the same build. clang/lld/llvm-dev are kept
      # for parity with the other two jobs; `tkc --check` never links.
      - name: Install LLVM/Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm-dev zlib1g-dev

      - name: Build tkc
        working-directory: .toke
        run: make tkc

      - name: Compile every toke source the site is built from
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
        run: make TKC="$TKC" check-toke

      # 132.100: Python and the two tokenizer libraries come before the first
      # step that reads them. check-site-examples re-derives the home page's
      # cl100k_base counts with tiktoken; with tiktoken absent it only printed
      # a note, so those counts were never re-derived here. REQUIRE_TIKTOKEN=1
      # makes a missing install a failure.
      - name: Python and the tokenizer references (tiktoken, tokenizers)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tiktoken and tokenizers
        run: python3 -m pip install --quiet tiktoken==0.12.0 tokenizers==0.22.2

      # Story 132.44: every toke program the SITE PUBLISHES must compile too —
      # /tokens shipped two v0.3 `=`-equality programs under a green tick, and
      # /tokenizer shipped five presets that the compiler rejects. The tick is
      # written from this compile result, so this job is what makes it true.
      - name: Every published toke program compiles, and the /tokens ticks are real
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
          REQUIRE_TIKTOKEN: "1"
        run: make TKC="$TKC" check-site-examples

      # Story 132.52a: the /tokenizer page's in-browser BPE is checked, under
      # node, against the `tokenizers` library on the artefact it loads. The
      # page disagreed with the library on FizzBuzz (68 vs 65) until this gate.
      - name: The /tokenizer page's BPE reproduces the tokenizers library
        run: make check-bpe-reference

      # Story 132.36: the stdlib module count on the home page is filled from the
      # fact sheet the compiler repo derives from the tree. It drifted twice in
      # one day while it was typed by hand.
      - name: Published counts match the tree
        env:
          TOKE_REPO: ${{ github.workspace }}/.toke
        run: make TOKE_REPO="$TOKE_REPO" check-facts

      # /llms.txt is generated from docs/about/canonical.json in the compiler
      # repo, which is checked out above. A hand-edit to either side fails here.
      - name: /llms.txt matches the canonical facts block
        env:
          TOKE_DOCS: ${{ github.workspace }}/.toke/docs
        run: make check-llms

      # Story 134.32: content/docs/ is a tracked copy of the toke repo's docs,
      # and this is the only job with that repo checked out, so drift is
      # checked here. STRICT since 132.51a: the ~30-file backlog this job used
      # to tolerate in report mode was synced and reviewed (49 paths), so any
      # drift now is new and fails. The fix is `make docs-content`, a reviewed
      # diff, and a commit of content/docs -- never a rewrite inside CI.
      - name: content/docs matches the toke docs
        env:
          TOKE_REPO: ${{ github.workspace }}/.toke
        run: make TOKE_REPO="$TOKE_REPO" check-docs-content

  # Job 2: generated content must match its source, and build/ must be
  # reproducible from committed files (story 132.17b).
  check-generated:
    name: Generated content and build/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # /roadmap and the home-page milestones block both come from
      # content/roadmap.json; neither may be edited by hand.
      - name: Roadmap is current
        run: make check-roadmap

      # 132.149: /docs is rendered by `ooke build`, so the ooke version decides
      # what every /docs page says. This job used to run `make build` with no
      # ooke at all (build_static.sh stopped at 'ooke not found'); locally the
      # build used whatever binary sat in a developer's ooke checkout. OOKE_REF
      # pins one ooke commit; it is checked out here and built against the toke
      # below by scripts/build_ooke.sh, the same script `make build` runs locally.
      - name: Read the pinned ooke commit (OOKE_REF)
        id: ooke
        run: echo "ref=$(./scripts/build_ooke.sh --print-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out ooke at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: karwalski/ooke
          ref: ${{ steps.ooke.outputs.ref }}
          path: .ooke

      # ooke is a toke program: it needs the compiler and the stdlib, got the
      # same way as in the other two jobs.
      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          repository: karwalski/toke
          path: .toke

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm-dev libssl-dev zlib1g-dev libsqlite3-dev

      - name: Build tkc
        working-directory: .toke
        run: make tkc

      # build/ is gitignored but the deploy rsyncs it, so it has to be
      # reproducible here from committed sources alone, and never stale.
      # make build runs scripts/build_ooke.sh: the pinned ooke, built from .ooke.
      - name: Rebuild build/ from committed sources
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
          TOKE_REPO: ${{ github.workspace }}/.toke
          OOKE_SRC: ${{ github.workspace }}/.ooke
        run: make build TKC="$TKC" TOKE_REPO="$TOKE_REPO" OOKE_SRC="$OOKE_SRC"

      - name: build/ is newer than everything it derives from
        run: make check-build-fresh

      # 132.89: every in-site link on a rendered /docs page resolves.
      - name: Rendered docs link only to what the site serves
        run: make check-doc-links

      # 132.148: every rendered /docs page carries its source's title -- no
      # YAML quote kept, nothing cut at a colon, no empty title.
      - name: Rendered docs carry their source titles
        run: make check-doc-titles

      # toke 121.27: host-key checking on, no TLS key shipped, no key file or
      # infrastructure address committed (the gate runs its own selftest).
      - name: Deploy posture
        run: make check-deploy-posture

  # Job 3: compile the server binary on Linux, start it, and check that every
  # route the repository defines answers 200.
  build-smoke:
    name: Binary compile and route smoke test
    runs-on: ubuntu-latest
    needs: [check-toke, check-generated]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          repository: karwalski/toke
          path: .toke

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm-dev libssl-dev zlib1g-dev libsqlite3-dev

      - name: Build tkc
        working-directory: .toke
        run: make tkc

      - name: Build the website binary
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
          TOKE_REPO: ${{ github.workspace }}/.toke
        run: make TKC="$TKC" TOKE_REPO="$TOKE_REPO"

      # 132.149: the pinned ooke, as in check-generated.
      - name: Read the pinned ooke commit (OOKE_REF)
        id: ooke
        run: echo "ref=$(./scripts/build_ooke.sh --print-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out ooke at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: karwalski/ooke
          ref: ${{ steps.ooke.outputs.ref }}
          path: .ooke

      - name: Rebuild build/
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
          TOKE_REPO: ${{ github.workspace }}/.toke
          OOKE_SRC: ${{ github.workspace }}/.ooke
        run: make build TKC="$TKC" TOKE_REPO="$TOKE_REPO" OOKE_SRC="$OOKE_SRC"

      - name: Start the server and check every route
        run: ./scripts/check_routes.sh 8099

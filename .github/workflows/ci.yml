name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: the site's own toke sources must compile under the pinned compiler.
  #
  # Story 132.17a: main.tk sat at HEAD for months written in v0.3 `=`-equality,
  # which tkc 2.8.0 rejects, so the website could not be rebuilt from its own
  # source until a worker migrated it by hand. Nothing caught it, because the
  # only compile step in this workflow was a placeholder echo. `make check-toke`
  # is that gate and it fails the build.
  check-toke:
    name: tkc --check (website toke sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO(48.1.4): tkc is not yet published to a public registry, so CI has
      # to build it from source. Replace with a release download once one
      # exists:
      #   curl -fsSL "${{ secrets.TKC_DOWNLOAD_URL }}" -o tkc && chmod +x tkc
      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          repository: karwalski/toke
          path: .toke
          token: ${{ secrets.TOKE_REPO_TOKEN }}

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm-dev

      - name: Build tkc
        working-directory: .toke
        run: make tkc

      - name: Compile every toke source the site is built from
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
        run: make TKC="$TKC" check-toke

      # Story 132.44: every toke program the SITE PUBLISHES must compile too —
      # /tokens shipped two v0.3 `=`-equality programs under a green tick, and
      # /tokenizer shipped five presets that the compiler rejects. The tick is
      # written from this compile result, so this job is what makes it true.
      - name: Every published toke program compiles, and the /tokens ticks are real
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
        run: make TKC="$TKC" check-site-examples

      # Story 132.36: the stdlib module count on the home page is filled from the
      # fact sheet the compiler repo derives from the tree. It drifted twice in
      # one day while it was typed by hand.
      - name: Published counts match the tree
        env:
          TOKE_REPO: ${{ github.workspace }}/.toke
        run: make TOKE_REPO="$TOKE_REPO" check-facts

      # /llms.txt is generated from docs/about/canonical.json in the compiler
      # repo, which is checked out above. A hand-edit to either side fails here.
      - name: /llms.txt matches the canonical facts block
        env:
          TOKE_DOCS: ${{ github.workspace }}/.toke/docs
        run: make check-llms

  # Job 2: generated content must match its source, and build/ must be
  # reproducible from committed files (story 132.17b).
  check-generated:
    name: Generated content and build/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # /roadmap and the home-page milestones block both come from
      # content/roadmap.json; neither may be edited by hand.
      - name: Roadmap is current
        run: make check-roadmap

      # build/ is gitignored but the deploy rsyncs it, so it has to be
      # reproducible here from committed sources alone, and never stale.
      - name: Rebuild build/ from committed sources
        run: make build

      - name: build/ is newer than everything it derives from
        run: make check-build-fresh

  # Job 3: compile the server binary on Linux, start it, and check that every
  # route the repository defines answers 200.
  build-smoke:
    name: Binary compile and route smoke test
    runs-on: ubuntu-latest
    needs: [check-toke, check-generated]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          repository: karwalski/toke
          path: .toke
          token: ${{ secrets.TOKE_REPO_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm-dev libssl-dev zlib1g-dev libsqlite3-dev

      - name: Build tkc
        working-directory: .toke
        run: make tkc

      - name: Build the website binary
        env:
          TKC: ${{ github.workspace }}/.toke/tkc
          TOKE_REPO: ${{ github.workspace }}/.toke
        run: make TKC="$TKC" TOKE_REPO="$TOKE_REPO"

      - name: Rebuild build/
        run: make build

      - name: Start the server and check every route
        run: ./scripts/check_routes.sh 8099
